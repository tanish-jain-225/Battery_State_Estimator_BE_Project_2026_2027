name: 🐛 Bug Report
description: Create a report to help us improve the Battery State Estimator
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much relevant context as possible.
  - type: input
    id: environment
    attributes:
      label: Operating System & Python Version
      description: What OS and Python version are you using?
      placeholder: e.g. Windows 11 / Ubuntu 22.04 LTS, Python 3.11.9
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `python software/simulator/app.py`
        2. In another terminal, run `python software/visualiser/app.py`
        3. Navigate to `http://localhost:5000`
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Tracebacks
      description: Please copy and paste any relevant terminal output or tracebacks.
      render: shell

