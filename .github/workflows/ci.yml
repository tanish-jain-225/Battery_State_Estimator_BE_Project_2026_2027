name: Simple CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build, Lint & Test (${{ matrix.os }}, Python 3.10)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      NON_INTERACTIVE: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r software/visualiser/requirements.txt
          pip install -r software/simulator/requirements.txt
          pip install -r hardware/STM_Verifier/requirements.txt
          pip install pytest flake8

      - name: Code Quality & Syntax Linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Suite
        run: |
          pytest tests/

      - name: Run End-to-End Validation Script (POSIX bash)
        if: runner.os != 'Windows'
        run: |
          bash run_all_validation.sh

      - name: Run End-to-End Validation Script (Windows cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          run_all_validation.bat

